<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prayer Mode - Memorial</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background: radial-gradient(circle at top, #050816 0%, #02040f 60%, #000 100%);
  color:white;
  overflow:hidden;
}

/* STARFIELD */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.mosque-layer{
  position:fixed;
  bottom:0;
  width:100%;
  height:60%;
  background-repeat:no-repeat;
  background-position:bottom center;
  background-size:cover;
  opacity:0.25;
}

.layer1{background:url("https://i.ibb.co/2Yy0p7k/mosque-silhouette.png");}
.layer2{background:url("https://i.ibb.co/2Yy0p7k/mosque-silhouette.png");opacity:0.15;transform:scale(1.1) translateY(10px);filter:blur(1px);}
.layer3{background:url("https://i.ibb.co/2Yy0p7k/mosque-silhouette.png");opacity:0.1;transform:scale(1.2) translateY(20px);filter:blur(2px);}

.moon{
  position:fixed;
  top:10%;
  left:-100px;
  width:80px;
  height:80px;
  background:radial-gradient(circle,#fff 20%,rgba(255,255,255,0.4));
  border-radius:50%;
  box-shadow:0 0 40px rgba(255,255,255,0.25);
  animation:moonMove 25s linear infinite;
}

@keyframes moonMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(120vw);}
}

.container{
  position:relative;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:850px;
  background:rgba(5,10,25,0.72);
  border-radius:25px;
  padding:30px 20px;
  text-align:center;
  backdrop-filter:blur(18px);
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

.names{
  font-size:16px;
  color:#cbd5e1;
  margin-bottom:20px;
}

.portraits{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.person img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
}

.lang{
  margin-top:15px;
}

p{
  font-size:13px;
  color:#cbd5e1;
  line-height:1.7;
}

.arabic{
  direction:rtl;
  font-size:16px;
  color:#fff;
}

#status{
  margin-top:15px;
  font-size:13px;
  color:#cbd5e1;
}

/* TAP SCREEN */
.tap{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  font-size:18px;
  z-index:999;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="mosque-layer layer1"></div>
<div class="mosque-layer layer2"></div>
<div class="mosque-layer layer3"></div>

<div class="moon"></div>

<div class="tap" id="tapScreen">Tap anywhere to start prayer 🤍</div>

<audio id="fatihah" src="AlFatihah.mp3"></audio>
<audio id="dua" src="dua.mp3"></audio>

<div class="container">
  <div class="box">

    <h1>🤍 Prayer Mode</h1>
    <div class="names">Mohsan Nazir & Imran Nazir</div>

    <div class="portraits">
      <div class="person">
        <img src="brother1.jpeg" onerror="this.src='https://via.placeholder.com/120'">
      </div>
      <div class="person">
        <img src="brother2.jpeg" onerror="this.src='https://via.placeholder.com/120'">
      </div>
    </div>

    <div class="lang">
      <h3>Arabic</h3>
      <p class="arabic">هذا مكان للذكر والدعاء والرحمة 🤍</p>
    </div>

    <div class="lang">
      <h3>اردو</h3>
      <p class="arabic">یہ دعا اور رحمت کا مقام ہے 🤍</p>
    </div>

    <div class="lang">
      <h3>English</h3>
      <p>A peaceful moment of prayer and remembrance 🤍</p>
    </div>

    <div class="lang">
      <h3>Dutch</h3>
      <p>Een rustig moment van gebed en herinnering 🤍</p>
    </div>

    <div id="status"></div>

  </div>
</div>

<script>
// stars
const starsContainer = document.getElementById("stars");

for(let i=0;i<80;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  starsContainer.appendChild(s);
}

// audio logic
const tap=document.getElementById("tapScreen");
const f=document.getElementById("fatihah");
const d=document.getElementById("dua");
const status=document.getElementById("status");

let started=false;

tap.addEventListener("click", async () => {
  if(started) return;
  started=true;
  tap.style.display="none";

  try{
    status.innerText="Playing Al-Fatihah...";
    await f.play();
  }catch(e){
    status.innerText="Error playing Al-Fatihah";
  }

  // when Fatihah ends → play Dua
  f.onended = async () => {
    try{
      status.innerText="Playing Dua...";
      await d.play();
    }catch(e){
      status.innerText="Error playing Dua";
    }
  };

  d.onplay = () => status.innerText="Making Dua...";
  d.onended = () => status.innerText="🤍 May Allah grant them Jannah.";
});
</script>

</body>
</html>
