<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Mode - Memorial</title>

<style>
  body{
    margin:0;
    font-family: Arial, sans-serif;
    background: #030612;
    color:white;
    overflow:hidden;
  }

  /* STAR FIELD */
  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle{
    from {opacity:0.2;}
    to {opacity:0.8;}
  }

  .container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
  }

  .box{
    max-width:750px;
    padding:40px;
    background: rgba(10, 15, 35, 0.85);
    border-radius:25px;
    backdrop-filter: blur(12px);
    box-shadow:0 25px 80px rgba(0,0,0,0.7);
  }

  h1{
    font-size:32px;
    margin-bottom:10px;
  }

  .names{
    font-size:20px;
    color:#cbd5e1;
    margin-bottom:15px;
  }

  p{
    color:#cbd5e1;
    line-height:1.7;
    font-size:15px;
  }

  button{
    margin-top:20px;
    padding:15px 45px;
    border:none;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:black;
  }

  button:hover{
    background:#d1d5db;
  }

  #status{
    margin-top:20px;
    color:#cbd5e1;
    font-size:14px;
  }

  .dua{
    margin-top:20px;
    font-size:17px;
    line-height:1.8;
  }

  .arabic{
    direction:rtl;
    font-size:18px;
    margin-bottom:10px;
    color:#f1f5f9;
  }
</style>
</head>

<body>

<script>
/* stars */
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDuration=(1+Math.random()*3)+"s";
  document.body.appendChild(s);
}
</script>

<div class="container">
  <div class="box">

    <h1>Prayer Mode</h1>

    <div class="names">
      Mohsan Nazir & Imran Nazir
    </div>

    <p>
      This is a space of remembrance and prayer.<br>
      Please focus and listen with heart 🤍
    </p>

    <button onclick="startPrayer()">Enter Prayer 🤍</button>

    <div id="status"></div>

    <div class="dua" id="duaBox"></div>

  </div>
</div>

<!-- AUDIO -->
<audio id="fatihah" src="AlFatihah.mp3"></audio>
<audio id="dua" src="dua.mp3"></audio>

<script>
let started=false;

function startPrayer(){

  if(started) return;
  started=true;

  document.querySelector("button").style.display="none";

  let status=document.getElementById("status");
  let box=document.getElementById("duaBox");

  status.innerText="Preparing...";

  setTimeout(()=>{

    status.innerText="Reciting Surah Al-Fatihah...";

    let f=document.getElementById("fatihah");

    f.play().then(()=>{

      f.onended=function(){

        status.innerText="Making Dua...";

        box.innerHTML=`
          <div class="arabic">
            اللَّهُمَّ اغْفِرْ لَهُمَا وَارْحَمْهُمَا
          </div>
          O Allah, forgive them both and have mercy on them.
        `;

        let d=document.getElementById("dua");

        d.play().then(()=>{

          d.onended=function(){
            status.innerText="🤍 May Allah grant Mohsan Nazir & Imran Nazir Jannah.";
          };

        }).catch(()=> {
          status.innerText="Tap once more to continue audio";
        });

      };

    }).catch(()=>{
      status.innerText="Tap screen to enable audio";
    });

  },500);
}
</script>

</body>
</html>
